<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#222235" />
    <link rel="icon" href="data:," />
    <title>vesen: No such file or directory</title>
    <style>
      html {
        background: #222235;
        color: #ffffff;
        font: 15px/1.6 ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 16px
          max(16px, env(safe-area-inset-left));
      }
      p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .user {
        color: #ff4757;
      }
      .host {
        color: #06c993;
      }
      .dir {
        color: #f69154;
      }
      .dim {
        color: #959dcb;
      }
      a {
        color: #5da3c1;
        text-underline-offset: 3px;
      }
      a:focus-visible {
        outline: 2px solid #5da3c1;
        outline-offset: 2px;
      }
      .cursor {
        display: inline-block;
        width: 0.6em;
        height: 1.15em;
        margin-left: 0.2em;
        vertical-align: text-bottom;
        background: #ffffff;
        animation: blink 1.06s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
        }
      }
      @media (max-width: 480px) {
        html {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <span class="user">guest</span>@<span class="host">vesen</span>:<span class="dir">~</span>$
        <span data-path>this path</span>
      </p>
      <p>vesen: <span data-path>this path</span>: No such file or directory</p>
      <p>
        <span class="user">guest</span>@<span class="host">vesen</span>:<span class="dir">~</span>$
        <a href="/">cd ~</a> <span class="dim"># back to the terminal</span><span class="cursor" aria-hidden="true"></span>
      </p>
    </main>
    <script>
      (function () {
        // The path stays percent-encoded, as the browser gives it, and is cut short, so a crafted
        // link cannot spell out a message on this domain or reorder it with bidi controls.
        var path = location.pathname;
        if (path.length > 60) path = path.slice(0, 59) + '\u2026';
        var nodes = document.querySelectorAll('[data-path]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = path;
      })();
    </script>
  </body>
</html>
