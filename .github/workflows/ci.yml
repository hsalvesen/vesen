name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A newer push to a pull request cancels the run it supersedes;
# pushes to main queue instead, so a live deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run check:strict
      - run: npm run check:boundaries
      - run: npm run check:glyphs
      - run: npm test
      # The stock Worker's address; an unset repository variable is an empty string, which the
      # app takes to mean the interim proxy (src/services/market/port.ts). The fetch proxy for
      # curl --via-proxy works the same way: empty means the site has none.
      - run: npm run build
        env:
          VITE_STOCK_API: ${{ vars.VITE_STOCK_API }}
          VITE_FETCH_PROXY: ${{ vars.VITE_FETCH_PROXY }}
      - run: npm run check:bundle
      - run: npm run check:contrast -- --strict

      # WebKit for the iPhone Instagram project: the main audience, and the engine where taps differ.
      - run: npx playwright install --with-deps chromium webkit
      # The smoke tests build again (playwright.config.ts), and that build is the one uploaded below.
      - run: npm run test:smoke
        env:
          VITE_STOCK_API: ${{ vars.VITE_STOCK_API }}
          VITE_FETCH_PROXY: ${{ vars.VITE_FETCH_PROXY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy-preview:
    needs: check
    # Forks have no access to the Firebase secret, and neither do runs for Dependabot's pull
    # requests, whose dependency updates should not deploy with the credential before review.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VESENTERMINAL }}
          projectId: vesenterminal

  deploy-live:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VESENTERMINAL }}
          channelId: live
          projectId: vesenterminal
